<div class="uv-viewport-controls">
  <div class="uv-left-controls-container" id="uv-left-controls-container">
    <button class="uv-control-button" id="uv-sync-selection" data-tooltip="UV Sync Selection">
      <img src="assets/icons/sync-select.svg" alt="UV Sync Selection" />
    </button>
    
    <div class="uv-tools" id="uv-tools">
      <button class="selection-button active" data-tool="select" data-tooltip="Select">
        <img src="assets/icons/select.svg" alt="Select" />
      </button>
      <button class="selection-button" data-tool="move" data-tooltip="Move">
        <img src="assets/icons/translate.svg" alt="Move" />
      </button>
      <button class="selection-button" data-tool="rotate" data-tooltip="Rotate">
        <img src="assets/icons/rotate.svg" alt="Rotate" />
      </button>
      <button class="selection-button" data-tool="scale" data-tooltip="Scale">
        <img src="assets/icons/scale.svg" alt="Scale" />
      </button>
    </div>
  </div>
</div>
